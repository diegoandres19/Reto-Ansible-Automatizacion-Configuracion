---
- name: Usar un secreto cifrado con Vault
  hosts: servidores
  become: true
  vars_files:
    - secretos.yml
  tasks:
    - name: Guardar la clave de la aplicacion
      ansible.builtin.copy:
        dest: /opt/miapp/secreto.txt
        content: "clave_app={{ clave_app }}\n"
        owner: devops
        mode: "0600"
      no_log: true
